[project]
name = "climate-ledger"
version = "1.0.0"
description = "Recompute the climate numbers everyone cites, from pinned raw data."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8"]
# Only `make freeze` needs a spreadsheet reader; `make verify` stays stdlib-only.
freeze = ["openpyxl>=3.1"]
