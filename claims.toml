# Registries.
#
# Datasets are fetched and pinned once each; several claims can read the same
# dataset, so a source is never frozen twice into two different vintages.
#
# Claims: tier "A" recomputes the value from the pinned bytes by
# claims/<id>/compute.py; tier "B" is transcribed from a document, and its
# claims/<id>/README.md must carry `quoted:`, `page:` and `checked_by:`.
#
# `extract = "xlsx"` converts a pinned spreadsheet into derived CSVs at freeze
# time, so verify never needs a spreadsheet dependency.

[[datasets]]
id = "smoke"
version = "fixture-1"

[datasets.source]
path = "fixtures/smoke.csv"

[[datasets]]
id = "gistemp"
version = "GISTEMP v4 (GLB.Ts+dSST.csv)"

[datasets.source]
url = "https://data.giss.nasa.gov/gistemp/tabledata_v4/GLB.Ts+dSST.csv"
filename = "GLB.Ts+dSST.csv"

[[datasets]]
id = "gcb-workbook"
version = "Global Carbon Budget 2025 v1.0 (DOI 10.18160/GCP-2025)"
extract = "xlsx"
sheets = ["Global Carbon Budget"]

[datasets.source]
url = "https://data.icos-cp.eu/objects/qSjPBsV1drZnYdH-yCJMmkGn"
licence_url = "https://data.icos-cp.eu/licence_accept?ids=%5B%22qSjPBsV1drZnYdH-yCJMmkGn%22%5D"
filename = "Global_Carbon_Budget_2025_v1.0.xlsx"

[[datasets]]
id = "gcb-paper"
version = "Friedlingstein et al. 2025, ESSD 18, 3211-3288"

[datasets.source]
url = "https://zenodo.org/api/records/22748763/files/essd-18-3211-2026.pdf/content"
filename = "essd-18-3211-2026.pdf"

# --- claims -----------------------------------------------------------------

[[claims]]
id = "smoke"
dataset = "smoke"
tier = "A"
question = "Does freeze, recompute and compare work end to end?"
status = "scaffold"
unit = "count"
published = 10.0
tolerance = 0.001

[[claims]]
id = "warming-year"
dataset = "gistemp"
tier = "A"
question = "Was 2024 the warmest year, and how far above 1850-1900?"
unit = "degC"
published = 1.55
tolerance = 0.06

[[claims]]
id = "warming-decade"
dataset = "gistemp"
tier = "A"
question = "What did the observed 2015-2024 decade average, above 1850-1900?"
unit = "degC"
published = 1.25
tolerance = 0.05

[[claims]]
id = "emissions-fossil-2024"
dataset = "gcb-workbook"
tier = "A"
question = "Did fossil CO2 emissions reach 37.8 Gt in 2024?"
unit = "GtCO2"
published = 37.8
tolerance = 0.2

[[claims]]
id = "emissions-total-2024"
dataset = "gcb-workbook"
tier = "A"
question = "Were total anthropogenic CO2 emissions 42.4 Gt in 2024?"
unit = "GtCO2"
published = 42.4
tolerance = 0.3

[[claims]]
id = "budget-1.5"
dataset = "gcb-paper"
tier = "B"
question = "How much CO2 is left for 1.5 C, and how many years is that?"
unit = "GtCO2"
published = 170
